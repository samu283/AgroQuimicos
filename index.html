<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroQuimicos</title>
   <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <header class="site-header">
    <h1>DomiBarrio</h1>
    <p>Pide a los negocios de tu barrio</p>
  </header>

  <main id="lista-negocios">
    <h2>Negocios del barrio</h2>
    
    <section class="negocio-caja">
      <img src="foto1.jpg" alt="Panadería La Esquina">
      <h3>Panadería La Esquina</h3>
      <p class="texto-secundario">Pedido mínimo $10.000</p>
      <p>Abierto</p>
      <button class="boton-menu">Ver menú</button>
    </section>

    <section class="negocio-caja">
      <img src="foto2.jpg" alt="Pizzería Don Carlo">
      <h3>Pizzería Don Carlo</h3>
      <p class="texto-secundario">Pedido mínimo $20.000</p>
      <p>Abierto</p>
      <button class="boton-menu">Ver menú</button>
    </section>

    <section class="negocio-caja">
      <img src="foto3.jpg" alt="Tienda Doña Rosa">
      <h3>Tienda Doña Rosa</h3>
      <p class="texto-secundario">Pedido mínimo $8.000</p>
      <p>Cerrado</p>
      <button class="boton-menu">Ver menú</button>
    </section>
  </main>

  <footer class="site-footer">
    <p>DomiBarrio · Barranquilla</p>
  </footer>
    
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroQuimicos</title>
   <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <header class="site-header">
    <h1>Agroquimicos</h1>
    <p>Disfruta de todo el catalogo de agroquimicos la cordialidad</p>
  </header>

  <main id="lista-negocios">
    <h2>Negocio del barrio</h2>
    
    <section class="negocio-caja">
      <img src="img/Logo.jpg" alt="Logo del negocio">
      <h3>Logo del negocio</h3>
    
      <form action="/buscar" method="get">
  <label for="campo-busqueda">Buscar en el sitio:</label>
  <input 
    type="search" 
    id="campo-busqueda" 
    name="q" 
    placeholder="Escribe lo que buscas..." 
    required
  >
  <button type="submit">Buscar</button>
</form>
        
      <a href="menu-negocio.html" ><button  class="boton-menu">Ver menú</button></a>
      
    </section>
  </main>
    <header>
    <h1 id="titulo">Mi proyecto</h1>
    <p>Listado, formulario y datos guardados en el navegador</p>
  </header>

  <main>
    <form id="formulario" class="formulario" novalidate>
      <h2>Agregar un registro</h2>

      <div class="campo" id="campo-titulo">
        <label for="titulo-input">Nombre</label>
        <input id="titulo-input" name="titulo" type="text" autocomplete="off">
        <p class="mensaje-error" id="error-titulo"></p>
      </div>

      <div class="campo" id="campo-categoria">
        <label for="categoria-input">Categoría</label>
        <select id="categoria-input" name="categoria">
          <option value="">Elige una…</option>
        </select>
        <p class="mensaje-error" id="error-categoria"></p>
      </div>

      <div class="campo" id="campo-subtitulo">
        <label for="subtitulo-input">Descripción corta</label>
        <input id="subtitulo-input" name="subtitulo" type="text" autocomplete="off">
        <p class="mensaje-error"></p>
      </div>

      <div class="campo" id="campo-numero">
        <label for="numero-input">Valor</label>
        <input id="numero-input" name="numero" type="text" inputmode="numeric" autocomplete="off">
        <p class="mensaje-error" id="error-numero"></p>
      </div>

      <div class="acciones">
        <button class="btn" type="submit">Guardar</button>
        <button class="btn btn-peligro" type="button" id="borrar-todo">Restaurar datos originales</button>
        <span id="estado" role="status"></span>
      </div>
    </form>

    <section class="filtros">
      <input id="buscador" type="search" placeholder="Buscar por nombre">
      <select id="categoria">
        <option value="">Todas las categorías</option>
      </select>
      <select id="orden">
        <option value="">Orden original</option>
        <option value="menor">Menor a mayor</option>
        <option value="mayor">Mayor a menor</option>
      </select>
    </section>

    <p id="contador"></p>
    <section id="lista" class="lista"></section>
  </main>

  <script src="js/06-domibarrio.js"></script>
  <script src="js/logica.js"></script>
  <script src="js/app.js"></script>
   
  <footer class="site-footer">
    <p>Agroquimicos  · Barranquilla</p>
  </footer>
    
</body>
</html>
